<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1100" cy="100" r="280" fill="#ffffff" fill-opacity="0.03"/>
  <circle cx="100" cy="550" r="200" fill="#ffffff" fill-opacity="0.02"/>

  <!-- Logo Badge -->
  <g transform="translate(100, 100)">
    <rect width="70" height="70" rx="18" fill="#ffffff" fill-opacity="0.12"/>
    <text x="35" y="48" font-size="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">📸</text>
  </g>

  <!-- Title & Description -->
  <text x="195" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="32" fill="#ffffff" letter-spacing="-0.5">Photos by Dodo</text>
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="64" fill="#ffffff" letter-spacing="-1.5">Calculator Foto Majorat</text>
  <text x="100" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="28" fill="#94a3b8">Estimare de preț instantă, transparentă și personalizată.</text>

  <!-- Feature Cards -->
  <g transform="translate(100, 420)">
    <rect width="280" height="110" rx="16" fill="#ffffff" fill-opacity="0.08"/>
    <text x="30" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="#ffffff">Calcul Rapid</text>
    <text x="30" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16" fill="#94a3b8">Slider invitați &amp; ore</text>
  </g>

  <g transform="translate(410, 420)">
    <rect width="280" height="110" rx="16" fill="#ffffff" fill-opacity="0.08"/>
    <text x="30" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="#ffffff">WhatsApp Direct</text>
    <text x="30" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16" fill="#94a3b8">Trimiți oferta dintr-un click</text>
  </g>

  <g transform="translate(720, 420)">
    <rect width="380" height="110" rx="16" fill="#ffffff" fill-opacity="0.08"/>
    <text x="30" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="#ffffff">@photosby_dodo</text>
    <text x="30" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16" fill="#94a3b8">Portofoliu &amp; servicii foto</text>
  </g>
</svg>
